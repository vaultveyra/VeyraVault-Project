name: Build VeyraVault APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 4. Apply v3.0 Upgrades
        run: python3 scripts/upgrade_v3_part1.py && python3 scripts/upgrade_v3_part2.py

      - name: 5. Prepare Workspace, NDK Licenses & Keystore
        run: python3 scripts/prepare_workspace.py

      - name: 6. Run Stage-1 Source Audit
        run: python3 scripts/audit_source.py

      - name: 7. Compile Signed Release APK
        working-directory: ./build_workspace
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 8. Package & Audit Final APK
        run: python3 scripts/prepare_workspace.py --post-build

      - name: 9. Upload Signed APK Bundle
        uses: actions/upload-artifact@v4
        with:
          name: VeyraVault-Release-Bundle
          path: output_artifacts/
