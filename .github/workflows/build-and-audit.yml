name: Build and audit VeyraVault APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and audit unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The V3 upgrade scripts currently generate a second, incompatible
      # com.veyravault.app source tree. Keep them staged until the migration
      # is completed; do not overwrite the working com.veyravault.space app.
      - name: Validate staged V3 migration scripts
        run: python3 -c "import ast; [ast.parse(open(p, encoding='utf-8').read(), filename=p) for p in ('scripts/upgrade_v3_part1.py', 'scripts/upgrade_v3_part2.py')]"

      - name: Test profile resolver contract
        run: python3 scripts/test_profile_resolver.py

      - name: Test security credential contract
        run: python3 scripts/test_security_credentials.py

      - name: Test engine install/launch failure contract
        run: python3 scripts/test_engine_contract.py

      - name: Test clone hook isolation contract
        run: python3 scripts/test_hook_isolation_contract.py

      - name: Test CloneStore migration inventory contract
        run: python3 scripts/test_clone_store_migration_inventory.py

      - name: Test inactive Room foundation contract
        run: python3 scripts/test_room_foundation_contract.py

      - name: Test read-only legacy CloneStore snapshot contract
        run: python3 scripts/test_legacy_clone_snapshot_contract.py

      - name: Test atomic legacy snapshot backup contract
        run: python3 scripts/test_legacy_clone_snapshot_backup_contract.py

      - name: Test opt-in legacy Room import contract
        run: python3 scripts/test_legacy_room_import_contract.py

      - name: Test Android Room instrumentation wiring
        run: python3 scripts/test_room_instrumentation_wiring.py

      - name: Prepare build workspace
        run: python3 scripts/prepare_workspace.py

      - name: Run Room Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: build_workspace
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Run source audit
        run: python3 scripts/audit_source.py > source_audit_report.txt

      - name: Compile unsigned release APK
        working-directory: ./build_workspace
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package and audit APK
        run: python3 scripts/prepare_workspace.py --post-build

      - name: Upload unsigned APK and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: VeyraVault-unsigned-build
          path: output_artifacts/
          if-no-files-found: error
          retention-days: 1

  sign-release:
    name: Sign APK in isolated job
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned build
        uses: actions/download-artifact@v4
        with:
          name: VeyraVault-unsigned-build
          path: unsigned

      - name: Sign APK using private repository secrets
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" || -z "${KS_PASS:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASS:-}" ]]; then
            echo "ERROR: Required signing secrets are missing. Refusing to report a successful release without a signed APK."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/veyravault-release.keystore"
          chmod 600 "$RUNNER_TEMP/veyravault-release.keystore"
          test -s "$RUNNER_TEMP/veyravault-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/veyravault-release.keystore" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null

          mkdir -p signed
          cp unsigned/VeyraVault-release.apk signed/VeyraVault-release.apk
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/veyravault-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            signed/VeyraVault-release.apk
          "$APKSIGNER" verify --verbose signed/VeyraVault-release.apk
          cp unsigned/source_audit_report.txt signed/ 2>/dev/null || true
          cp unsigned/apk_audit_report.txt signed/ 2>/dev/null || true
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VeyraVault-Signed-Release
          path: signed/
          if-no-files-found: error
          retention-days: 7
