name: Build and audit VeyraVault APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply VeyraVault upgrades
        run: python3 scripts/upgrade_v3_part1.py && python3 scripts/upgrade_v3_part2.py

      - name: Prepare build workspace
        run: python3 scripts/prepare_workspace.py

      - name: Configure release signing from repository secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KS_PASS:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASS:-}" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > build_workspace/app/release.keystore
            chmod 600 build_workspace/app/release.keystore
            test -s build_workspace/app/release.keystore
            keytool -list -keystore build_workspace/app/release.keystore -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null
            {
              printf 'V_KS_PASS=%s\n' "$KS_PASS"
              printf 'V_KEY_ALIAS=%s\n' "$KEY_ALIAS"
              printf 'V_KEY_PASS=%s\n' "$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "Private release signing configured."
          else
            echo "Signing secrets are not fully configured; building an unsigned release APK."
          fi

      - name: Run source audit
        run: python3 scripts/audit_source.py > source_audit_report.txt

      - name: Compile release APK
        working-directory: ./build_workspace
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Package and audit APK
        run: python3 scripts/prepare_workspace.py --post-build

      - name: Upload APK and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: VeyraVault-Release-Bundle
          path: |
            output_artifacts/VeyraVault-release.apk
            output_artifacts/source_audit_report.txt
            output_artifacts/apk_audit_report.txt
          if-no-files-found: error
          retention-days: 7
