apply plugin: 'com.android.application'

def signingStorePassword = System.getenv("V_KS_PASS")
def signingKeyAlias = System.getenv("V_KEY_ALIAS")
def signingKeyPassword = System.getenv("V_KEY_PASS")
def hasReleaseSigning = file("release.keystore").exists() &&
        signingStorePassword != null && !signingStorePassword.isEmpty() &&
        signingKeyAlias != null && !signingKeyAlias.isEmpty() &&
        signingKeyPassword != null && !signingKeyPassword.isEmpty()

android {
    compileSdkVersion __COMPILE_SDK__

    defaultConfig {
        applicationId "com.veyravault.space"
        minSdkVersion 21
        targetSdkVersion __TARGET_SDK__
        versionCode 200
        versionName "2.0.0-Enterprise"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file("release.keystore")
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':Bcore')
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.14'
}
