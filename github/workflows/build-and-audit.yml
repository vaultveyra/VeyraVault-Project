name: Build & Security Audit VeyraVault APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VeyraVault Repository
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Optimal for Android Virtualization NDK/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Prepare Full BlackBox Engine Workspace
        run: |
          python3 scripts/prepare_workspace.py

      - name: Stage 1 - Run Source Security Audit
        run: |
          python3 scripts/audit_source.py build_workspace > source_audit_report.txt

      - name: Prepare Release Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > build_workspace/app/release.keystore
            echo "V_KS_PASS=$KS_PASS" >> $GITHUB_ENV
            echo "V_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "V_KEY_PASS=$KEY_PASS" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore build_workspace/app/release.keystore \
              -alias veyravault -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass VeyraVaultKeyPass2025 -keypass VeyraVaultKeyPass2025 \
              -dname "CN=VeyraVault, OU=Personal, O=VeyraVault, L=Tehran, S=Tehran, C=IR"
            echo "V_KS_PASS=VeyraVaultKeyPass2025" >> $GITHUB_ENV
            echo "V_KEY_ALIAS=veyravault" >> $GITHUB_ENV
            echo "V_KEY_PASS=VeyraVaultKeyPass2025" >> $GITHUB_ENV
          fi

      - name: Compile Signed Release APK (Native C++ & Java)
        working-directory: build_workspace
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage 2 - Audit Final Compiled APK
        run: |
          APK_PATH=$(find build_workspace/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" VeyraVault-release.apk
          python3 scripts/audit_apk.py VeyraVault-release.apk > apk_audit_report.txt

      - name: Upload Signed APK & Security Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: VeyraVault-Release-Bundle
          path: |
            VeyraVault-release.apk
            source_audit_report.txt
            apk_audit_report.txt
            build_workspace/app/release.keystore
